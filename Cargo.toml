[package]
name = "rustutils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
libc = "0.2.171"
log = { version = "0.4", features = ["std"] }
nix = { version = "0.29.0", features = [
    "event",
    "feature",
    "fs",
    "inotify",
    "ioctl",
    "memoffset",
    "mman",
    "mount",
    "net",
    "poll",
    "process",
    "sched",
    "signal",
    "socket",
    "term",
    "time",
    "uio",
    "user",
] }
thiserror = "2.0.12"
